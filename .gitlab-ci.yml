stages:
  - notify

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

send-notification:
  stage: notify
  environment:
    name: gfz-prod
    url: https://sensors.gfz-potsdam.de
  tags:
    - deploy
    - prod
    - gfz
    - shell
  variables:
    SMS_VERSION: ${CI_COMMIT_REF}
    MATRIX_RELEASE_NOTIFICATION_HOOK: ${MATRIX_RELEASE_NOTIFICATION_HOOK}
  script:
    - >
      curl \
        -X POST ${MATRIX_RELEASE_NOTIFICATION_HOOK} \
        -H "Content-Type: application/json" \
        -d "{\"html\":\"@room 🚀<h2>SMS version <u>$SMS_VERSION</u> launched right now!</h2>\"}"


